{{- if .Values.global.enable_tls -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ironic-cacert
spec:
  commonName: ironic-ca
  isCA: true
  {{- include "ironic.subjectAltNames" . | indent 2 }}
  {{- with .Values.certificates.ca.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.certificates.ca.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
  # The CA keeps its key across renewals: the certificates it signed stay
  # valid, and the Bare Metal Operator and Ironic, which read the CA at start,
  # keep trusting it.
  privateKey:
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: ironic-cacert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ironic-cert
spec:
  commonName: ironic-cert
  {{- include "ironic.subjectAltNames" . | indent 2 }}
  {{- with .Values.certificates.server.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.certificates.server.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
  issuerRef:
    kind: Issuer
    name: ca-issuer
  secretName: ironic-cert
{{- if .Values.global.enable_vmedia_tls }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ironic-vmedia-cert
spec:
  commonName: ironic-vmedia-cert
  {{- include "ironic.subjectAltNames" . | indent 2 }}
  {{- with .Values.certificates.server.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.certificates.server.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
  issuerRef:
    kind: Issuer
    name: ca-issuer
  secretName: ironic-vmedia-cert
{{- end }}
{{- end }}
